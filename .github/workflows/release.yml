name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  package:
    needs: test
    uses: ./.github/workflows/package.yml
  release:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Prepare reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes dist/termium-*.tar.gz dist/termium-*.sha256
