name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-server:
    name: Build Server Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install ts-proto
        run: cd server && npm install

      - name: Build server bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-server-bundle.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: dist/termium-server-*.tar.gz

  build-client:
    name: Build Client Binaries
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate Go protobuf
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          mkdir -p client/pb
          protoc --go_out=client/pb --go_opt=paths=source_relative \
                 --go-grpc_out=client/pb --go-grpc_opt=paths=source_relative \
                 -I proto proto/bc.proto

      - name: Download server bundle
        uses: actions/download-artifact@v4
        with:
          name: server-bundle
          path: dist/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
