syntax = "proto3";

package pb;

option go_package = "termium/client/pb";

service BrowserControl {
  rpc OpenTab (Empty) returns (Message) {}
  rpc SetViewport (ViewportSize) returns (Message) {}
  rpc ClickMouse (Coordinate) returns (Message) {}
  rpc SendKeyboardInput (Text) returns (Message) {}
  rpc NavigateToUrl (Url) returns (Message) {}
  rpc GetCurrentUrl (Empty) returns (Url) {}
  // Streaming RPC for continuous screenshots
  rpc StreamScreenshots (ScreenshotRequest) returns (stream Screenshot) {}
  // Bidirectional streaming for dialog handling
  rpc StreamDialogs (stream DialogResponse) returns (stream DialogEvent) {}
}

message Empty {}

message Message {
  string text = 1;
}

message ViewportSize {
  int32 width = 1;
  int32 height = 2;
}

message Coordinate {
  int32 x = 1;
  int32 y = 2;
}

message Text {
  string content = 1;
}

message Url {
  string url = 1;
}

message Screenshot {
  bytes data = 1;
}

message ScreenshotRequest {
  int32 fps = 1;
}

// Dialog event sent from server to client
message DialogEvent {
  string id = 1;  // Unique dialog ID for response matching
  DialogType type = 2;
  string message = 3;
  string default_value = 4;  // For prompt dialogs
}

enum DialogType {
  ALERT = 0;
  CONFIRM = 1;
  PROMPT = 2;
  BEFOREUNLOAD = 3;
}

// Dialog response from client to server
message DialogResponse {
  string id = 1;  // Match with DialogEvent.id
  bool accepted = 2;
  string input_text = 3;  // For prompt dialogs
}
